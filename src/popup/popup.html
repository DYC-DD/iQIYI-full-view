<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="body">
      <div class="brand">
        <img src="../../assets/icons/icon48.png" alt="" />
        <h1 id="title"></h1>
      </div>
      <p class="desc" id="desc"></p>
      <div class="row">
        <span class="value" id="statusValue" role="status"></span>
      </div>
      <div class="setting-row">
        <span class="setting-copy">
          <span class="setting-label" id="autoCloseAdLabel"></span>
          <span class="setting-desc" id="autoCloseAdDesc"></span>
        </span>
        <label class="switch">
          <input
            type="checkbox"
            id="autoCloseAdToggle"
            aria-labelledby="autoCloseAdLabel"
            aria-describedby="autoCloseAdDesc"
          />
          <span class="switch-track" aria-hidden="true"></span>
        </label>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
